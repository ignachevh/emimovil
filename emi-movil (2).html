<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMI Móvil</title>
<meta name="theme-color" content="#F2F3F5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F5;--sf:#fff;--tx:#1A1F2B;--mu:#5B6475;--ln:#E1E4EA;--nv:#1D2F5C;--nv-d:#152346;--nv-t:#E9EDF5;--go:#B8902F;--go-d:#86661A;--go-t:#F6EFDD;--ok:#2F7A4F;--ok-t:#E4F0E8;--er:#B42318;
--ff:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--tx);font:15px/1.45 var(--ff);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.n{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:.005em}
h2{font-size:23px;line-height:1.15}h3{font-size:18px;line-height:1.2}
.n{font-variant-numeric:tabular-nums}
b{font-weight:600}p{margin:8px 0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--nv);outline-offset:2px}
svg{flex:none}

/* Cabecera */
#hd{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px 16px;display:flex;align-items:center;gap:2px;background:var(--bg);border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
#hd.sc{background:var(--sf);border-color:var(--ln)}
#hd h1{font-size:23px;flex:1;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .mk{color:var(--nv);display:grid}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--nv);position:relative;cursor:pointer;font-size:18px;padding:0}
.ib:active{background:var(--nv-t)}
.ib.p{width:36px;height:36px;border-radius:8px;background:var(--sf);border:1px solid var(--ln);font-size:19px;line-height:1}
.bd{position:absolute;top:3px;right:2px;background:var(--er);color:#fff;font:600 10px/1 var(--ff);border-radius:8px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border:2px solid var(--bg)}
#hd.sc .bd{border-color:var(--sf)}

main{display:block;min-height:100vh;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 64px) 16px calc(env(safe-area-inset-bottom,0px) + 92px)}
.sc-in{animation:fi .18s ease-out both}@keyframes fi{from{opacity:0}}

/* Bloques y listas */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card.row{border-radius:0;margin:0;border-top-width:0;min-height:58px}
.card.row:first-child,:not(.card.row)+.card.row{border-top-width:1px;border-radius:12px 12px 0 0}
.card.row:last-child,.card.row:has(+:not(.card.row)){border-radius:0 0 12px 12px;margin-bottom:16px}
.card.row:first-child:last-child,:not(.card.row)+.card.row:is(:last-child,:has(+:not(.card.row))){border-radius:12px}
.t{cursor:pointer}.t:active{opacity:.72}.card.row.t:active{opacity:1;background:#F6F7F9}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13.5px}
.sh{font:600 13px/1.3 var(--ff);color:var(--mu);margin:20px 4px 8px}.st>.sh:first-child{margin-top:4px}
.bh{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.lnk{background:none;border:0;color:var(--nv);font:600 14px var(--ff);padding:4px 0;cursor:pointer}
.it{width:34px;height:34px;border-radius:9px;background:var(--nv-t);color:var(--nv);display:grid;place-items:center;flex:none}

.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;text-align:center;font-size:12.5px;margin-bottom:16px}
.gr .ci{width:50px;height:50px;border-radius:13px;margin:0 auto 7px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--ln);color:var(--nv)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;touch-action:pan-x pan-y}.chips::-webkit-scrollbar{display:none}
.st>.chips{margin:0 -16px;padding:2px 16px 12px}
.chip{flex:none;padding:7px 12px;border-radius:8px;font:500 14px/1.3 var(--ff);border:1px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer}
.chip:active{background:var(--nv-t)}
.chip.on,.chip.on:active{background:var(--nv);border-color:var(--nv);color:#fff}

.btn{display:block;border:0;border-radius:10px;padding:13px 16px;font:600 15px/1.2 var(--ff);background:var(--nv);color:#fff;width:100%;cursor:pointer;text-align:center}
.btn:active{background:var(--nv-d)}
.btn.gh{background:var(--sf);color:var(--nv);border:1px solid var(--ln)}.btn.gh:active{background:var(--nv-t)}
.btn[disabled]{opacity:.45;pointer-events:none}

input,textarea,select{width:100%;border:1px solid #CBD1DA;border-radius:10px;padding:12px;font:16px var(--ff);background:var(--sf);color:var(--tx);margin:6px 0 10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--nv);box-shadow:0 0 0 3px var(--nv-t)}
.se{padding:2px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;margin-bottom:12px;background:var(--sf);border:1px solid var(--ln);color:var(--mu)}
.se input{margin:0;border:0;padding:10px 0;box-shadow:none!important}

/* Credencial */
.cred{position:relative;overflow:hidden;background:var(--nv);color:#fff;border-radius:14px;padding:16px 16px 14px;margin-bottom:22px;box-shadow:0 1px 2px rgba(16,24,40,.1),0 10px 24px -12px rgba(29,47,92,.6);cursor:pointer}
.cred:before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%2727%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%27.7%27%3E%3Cpath%20d%3D%27M0%204.5c22.5-9%2067.5-9%2090%200s67.5%209%2090%200%27/%3E%3Cpath%20d%3D%27M0%2013.5c22.5-9%2067.5-9%2090%200s67.5%209%2090%200%27/%3E%3Cpath%20d%3D%27M0%2022.5c22.5-9%2067.5-9%2090%200s67.5%209%2090%200%27/%3E%3C/g%3E%3C/svg%3E") repeat;opacity:.09;pointer-events:none}
.cred:after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 14px rgba(255,255,255,.03),0 0 0 28px rgba(255,255,255,.025);pointer-events:none}
.cred>*{position:relative;z-index:1}
.cr-mk{color:var(--go);display:grid}
.cr-org{font-weight:600;font-size:13.5px;line-height:1.2}.cr-sub{font-size:12px;opacity:.7}
.cr-ges{font:600 15px var(--fd);color:#E9D9AE}
.cr-mid{margin:16px 0 14px;gap:14px}
.cr-ph{width:54px;height:66px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font:600 20px var(--fd);overflow:hidden;flex:none}
.cr-ph img{width:100%;height:100%;object-fit:cover}
.cr-nm{font:600 23px/1.1 var(--fd)}.cr-car{font-size:13.5px;opacity:.8;margin-top:3px}
.cr-bot{align-items:flex-end}
.cr-bot dl{margin:0;display:grid;grid-template-columns:auto auto;gap:8px 18px;justify-content:start}
.cr-bot dt{font-size:11.5px;opacity:.65}.cr-bot dd{margin:0;font-size:15px;font-weight:600}
.cr-ok{grid-column:1/-1}.cr-ok dd{display:flex;align-items:center;gap:6px;font-size:13.5px}
.cr-ok dd:before{content:"";width:7px;height:7px;border-radius:50%;background:#7BD19B}
.qr{background:#fff;border-radius:8px;padding:6px;width:96px;height:96px;flex:none}
.id{border-radius:14px;padding:16px;position:relative;overflow:hidden;border:1px solid var(--ln)}

.nx .nx-h{font-size:30px;line-height:1;color:var(--nv);min-width:64px}
.nwc{flex:none;width:228px;margin:0;display:flex;flex-direction:column;gap:3px}
.nw-c{font-size:12.5px;font-weight:600;color:var(--go-d)}

.cv{display:block;width:36px;height:50px;border-radius:2px 5px 5px 2px;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.16),inset -1px 0 0 rgba(255,255,255,.12)}
.cd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}

.sk{height:58px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,#E6E8EC 25%,#EFF1F4 50%,#E6E8EC 75%);background-size:200% 100%;animation:sk 1.3s linear infinite}@keyframes sk{to{background-position:-200% 0}}
.em{text-align:center;padding:26px 16px;color:var(--mu);font-size:14px;border:1px dashed #CFD5DE;border-radius:12px;margin-bottom:16px}

/* Barra inferior */
#tb{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid var(--ln);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
#tb button{flex:1;max-width:112px;background:none;border:0;font:500 11px/1.2 var(--ff);color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
#tb button span{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
#tb button.on{color:var(--nv);font-weight:600}#tb button.on span{background:var(--nv-t)}

/* Hojas, avisos */
#ov{position:fixed;inset:0;z-index:10;background:rgba(16,22,34,.42);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
#ov.on{opacity:1;pointer-events:auto}
#sh{width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:28px 18px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--sf);position:relative}
#sh:before{content:"";position:absolute;top:9px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#D3D8E0}
#ov.on #sh{transform:none}
#sh .card{background:#F7F8FA}
#ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-8px);opacity:0;z-index:20;background:#1A1F2B;color:#fff;padding:10px 16px;border-radius:8px;transition:opacity .2s,transform .2s;font-size:14px;pointer-events:none;max-width:calc(100% - 32px)}
#ts.on{opacity:1;transform:translate(-50%,0)}
#off{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:0;right:0;z-index:7;background:#FFF4D6;color:#5C4200;border-bottom:1px solid #EBD9A6;padding:8px 16px;display:none;align-items:center;gap:10px;font-size:13.5px}

.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.ahora{background:var(--ok-t);color:var(--ok)}.sig{background:var(--go-t);color:var(--go-d)}.fin{background:#EEF0F3;color:var(--mu)}
.pulse{border-color:var(--go)!important}

.stp{display:flex;margin-top:14px;font-size:11.5px;text-align:center}
.stp div{flex:1;position:relative;color:var(--mu)}
.stp div:before{content:"";display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 6px;background:#D3D8E0;position:relative;z-index:1;box-sizing:border-box}
.stp div:after{content:"";position:absolute;top:4px;left:50%;width:100%;height:2px;background:#E1E4EA}
.stp div:last-child:after{display:none}
.stp div.d{color:var(--tx)}.stp div.d:before,.stp div.d:after{background:var(--ok)}
.stp div.c{color:var(--tx);font-weight:600}.stp div.c:before{background:#fff;border:2px solid var(--go)}

.bub{max-width:84%;padding:10px 13px;border-radius:14px;margin-bottom:8px}
.me{background:var(--nv);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:var(--sf);border:1px solid var(--ln);border-bottom-left-radius:4px}

.ck circle,.ck path{stroke:var(--ok);stroke-width:4;fill:none;stroke-dasharray:200;stroke-dashoffset:200;animation:dr .6s .1s forwards}.ck path{animation-delay:.4s}@keyframes dr{to{stroke-dashoffset:0}}
.spin{width:40px;height:40px;border:3px solid var(--nv-t);border-top-color:var(--nv);border-radius:50%;animation:rt .8s linear infinite;margin:20px auto}@keyframes rt{to{transform:rotate(360deg)}}
.rt{animation:dsh 1s linear infinite}@keyframes dsh{to{stroke-dashoffset:-20}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style></head><body>

payfoto(){if(S.fmode=='aula'){S.fau=$('#fau').value.trim();if(!S.fau)return toast('Escribe el número de aula')}pay(+S.fc.reduce((a,c)=>a+c.q*(c.col?1:.3),0).toFixed(1),`${S.fc.length} documento(s) · ${S.fmode=='aula'?'aula '+S.fau:'bloque '+S.fmode}`,()=>{S.fc=[]})},
cv(v){S.cv=v;render(false)},acd(v){S.cv='m';A.day2(v)},mm(v){S.cm+=+v;if(S.cm>11){S.cm=0;S.cy++}if(S.cm<0){S.cm=11;S.cy--}render(false)},mes(v){S.cm=+v;S.cv='m';render(false)},day2(v){S.cd=v;S.cy=+v.slice(0,4);S.cm=+v.slice(5,7)-1;keep()},
remN(){sheet(`<h2>Nuevo recordatorio</h2><input id="rt" placeholder="Título"><input id="rd" type="date" value="${S.cd}"><select id="rc"><option value="a">Actividad</option><option value="e">Examen</option><option value="d">Entrega</option><option value="r">Personal</option></select><button class="btn" data-a="remS">Crear recordatorio</button><button class="btn gh" style="margin-top:8px" data-a="close">Cancelar</button>`)},
remS(){const t=$('#rt').value.trim(),d=$('#rd').value;if(!t||!d)return toast('Completa título y fecha');S.rem.push([d,t,$('#rc').value,Date.now()]);S.cd=d;S.cy=+d.slice(0,4);S.cm=+d.slice(5,7)-1;close();render(false);toast('Recordatorio creado')},
remD(v){sheet(`<h2>¿Eliminar recordatorio?</h2><button class="btn" data-a="remD2" data-v="${v}">Eliminar</button><button class="btn gh" style="margin-top:8px" data-a="close">Cancelar</button>`)},
remD2(v){S.rem=S.rem.filter(r=>r[3]!=v);close();render(false);toast('Recordatorio eliminado')},
nf(v){S.nf=v;keep()},nw(v){const n=NEWS[v];sheet(`<span class="pill sig">${n[0]}</span><h2 style="margin:8px 0">${n[1]}</h2><p class="mu">${n[2]}</p><p>${n[3]}</p>${ENR.includes(n[0])?(S.enr[v]?'<button class="btn" disabled>Inscrito ✓</button>':`<button class="btn go" data-a="enr" data-v="${v}">Inscribirme</button>`):''}<button class="btn gh" style="margin-top:8px" data-a="close">Cerrar</button>`)},
enr(v){sheet(`<h2>¿Confirmar inscripción?</h2><p class="mu">${NEWS[v][1]}</p><button class="btn" data-a="enr2" data-v="${v}">Confirmar</button><button class="btn gh" style="margin-top:8px" data-a="close">Cancelar</button>`)},
enr2(v){if(S.off)return toast('Sin conexión');S.enr[v]=1;ok('¡Inscripción confirmada!');notify('Inscrito: '+NEWS[v][1],'home')},
back(){S.stack.length?S.stack.pop():S.tab='home';render();scrollTo(0,0)},close(){close();if(cur()=='lib')keep()},
day(v){S.day=+v;render(false)},
cls(v){const c=CL[v];sheet(`<h2>${c[3]}</h2><p class="mu">${DN[c[0]]} ${c[1]}–${c[2]}<br>Profesor: ${c[5]}<br>Aula: ${c[4]}</p><button class="btn" data-a="tomap">Ver en el Mapa</button><button class="btn gh" style="margin-top:8px" data-a="whr" data-v="${v}">Preguntar al asistente</button>`)},
whr(v){close();S.stack.push('chat');reply('¿Dónde está el laboratorio de electrónica?');head()},
paysal(){pay(S.saldo,'Colegiatura pendiente',()=>{S.q.forEach(c=>c.p=1);S.notifs=S.notifs.filter(n=>n.to!='pay')})},
pq(v){pay(S.q[v].m,S.q[v].n,()=>{S.q[v].p=1})},par(v){pay(ARAN[v][1],ARAN[v][0],()=>{})},pdef(v){S.pm=v;keep();toast('Método predeterminado: '+v)},
rec(v){const h=S.hist[v];sheet(`<h2>Comprobante</h2><p class="mu">${esc(h[0])}</p><div class="card p"><div class="row"><span class="sp mu">Monto</span><b>${h[1]}</b></div><div class="row"><span class="sp mu">Fecha</span><b>${h[3]||'—'}</b></div><div class="row"><span class="sp mu">Método</span><b>${h[4]||'—'}</b></div><div class="row"><span class="sp mu">N.º</span><b>${h[5]||'—'}</b></div></div><button class="btn" data-a="shr">Compartir comprobante</button><button class="btn gh" style="margin-top:8px" data-a="close">Cerrar</button>`)},shr(){close();toast('Comprobante compartido')},
scat(v){S.shc=v;render(false)},smode(v){S.smode=v;keep()},sq(v){const[i,d]=v.split(',');S.sc[i]=Math.max(0,(S.sc[i]||0)+ +d);if(!S.sc[i])delete S.sc[i];keep()},
spay(){if(S.smode=='aula'){S.saula=$('#saula').value.trim();if(!S.saula)return toast('Escribe el número de aula')}pay(stot(),'Tienda · '+Object.values(S.sc).reduce((a,b)=>a+b,0)+' artículos',()=>{S.sc={}})},
payfood(){if(S.mode=='aula'&&!$('#aula').value.trim()){toast('Escribe el número de aula');return}if(S.mode=='aula')S.aula=$('#aula').value;pay(total(),S.mode=='aula'?'Comida para el aula '+S.aula:'Comida (recoger)',()=>{S.cart={}})},
pm(v){P.m=v;payS()},
pgo(){if(S.off){toast('Sin conexión');return}sheet('<div class="em"><div class="spin"></div>Procesando pago…</div>');setTimeout(()=>{if(S.off){sheet(`<div class="em">No se pudo completar el pago. Revisa tu conexión.</div><button class="btn" data-a="pgo">Reintentar</button><button class="btn gh" style="margin-top:8px" data-a="close">Cancelar</button>`);return}P.done();S.hist.unshift([P.label,'Bs '+P.amount,'Pagado',new Date().toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}),P.m,'#EMI-'+(Math.floor(Math.random()*9000)+1000)]);ok('¡Pago exitoso!','Comprobante guardado en tu historial.');render(false);toast('Pago con '+P.m)},1700)},
qty(v){const[i,d]=v.split(',');S.cart[i]=Math.max(0,(S.cart[i]||0)+ +d);if(!S.cart[i])delete S.cart[i];const y=SC().scrollTop;render(false);SC().scrollTop=y},
mode(v){S.mode=v;const y=SC().scrollTop;render(false);SC().scrollTop=y},
lf(v){S.lf=v;render(false)},

renew(v){sheet(`<h2>¿Renovar préstamo?</h2><p class="mu">${BOOKS[S.loans[v].i][0]} se extenderá 7 días.</p><button class="btn" data-a="renew2" data-v="${v}">Renovar</button><button class="btn gh" style="margin-top:8px" data-a="close">Cancelar</button>`)},
renew2(v){if(S.off){toast('Sin conexión');return}S.loans[v].r=1;S.loans[v].d='19 oct';close();render(false);toast('Préstamo renovado')},
dis(v,e){e.stopPropagation();S.notifs=S.notifs.filter(n=>n.id!=v);render(false)},
treq(v){if(v==3)return credSheet();const t=TRT[v];sheet(`<h2>${t[0]}</h2><p class="mu">${t[3]}</p><textarea id="mot" rows="3" placeholder="Motivo de la solicitud"></textarea><div class="row" style="margin-bottom:10px"><span class="sp mu">Costo</span><b class="n">Bs ${t[1]}</b></div><button class="btn" data-a="tsend" data-v="${v}">Continuar al pago</button><button class="btn gh" style="margin-top:8px" data-a="close">Cancelar</button>`)},
tsend(v){if(!$('#mot').value.trim())return toast('Escribe el motivo');if(S.off)return toast('Sin conexión');pay(TRT[v][1],TRT[v][0],()=>mkT(v))},
cst(v){S.cn=$('#cn').value.trim()||S.cn;S.cs=+v;credSheet()},cpay(){S.cn=$('#cn').value.trim()||S.cn;if(!S.foto)return toast('Sube tu foto');pay(40,'Nueva credencial',()=>mkT(3))},
tcan(v){sheet(`<h2>¿Cancelar trámite?</h2><p class="mu">Puedes volver a solicitarlo sin costo.</p><button class="btn" data-a="tcan2" data-v="${v}">Cancelar trámite</button><button class="btn gh" style="margin-top:8px" data-a="close">Mantener</button>`)},
tcan2(v){S.tr=S.tr.filter(t=>t.id!=v);close();render(false);toast('Trámite cancelado')},
edit(){sheet(`<h2>Editar perfil</h2><span class="mu">Teléfono</span><input id="et" value="${esc(S.me.tel)}" inputmode="tel"><span class="mu">Correo</span><input id="em" value="${esc(S.me.mail)}" inputmode="email"><p class="mu">Los datos académicos no se pueden editar.</p><button class="btn" data-a="esave">Guardar cambios</button>`)},
esave(){const m=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){toast('Correo no válido');return}S.me={tel:$('#et').value,mail:m};close();render(false);toast('Perfil actualizado')},
ask(v){reply(v)},send(){const i=$('#ci');if(i.value.trim())reply(i.value.trim())},
toggle(){S.off=!S.off;render(false)},online(){S.off=false;render(false);toast('Conexión restablecida')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){const k=a.dataset.a;if(Object.prototype.hasOwnProperty.call(A,k)&&typeof A[k]=='function')A[k](a.dataset.v,e);return}const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.lb=e.target.value;$('#sec').innerHTML=libBody()}});
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(e.target.id=='cf'){if(!f.type.startsWith('image/')||f.size>5e6)return toast('Sube una imagen de hasta 5 MB');S.cn=$('#cn')?$('#cn').value:S.cn;const r=new FileReader();r.onload=()=>{S.foto=r.result;credSheet()};r.readAsDataURL(f)}if(e.target.id=='ff'){if(f.size>10e6)return toast('El archivo supera 10 MB');S.ff={n:f.name,s:f.size};$('#fdoc').value=f.name.replace(/\.[^.]+$/,'');$('#finfo').innerHTML=finfo()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')A.send()});
$('#ov').addEventListener('click',e=>{if(e.target.id=='ov')close()});
addEventListener('scroll',()=>$('#hd').classList.toggle('sc',scrollY>4),{passive:true});
$('#tb').insertAdjacentHTML('beforeend',TABS.map(t=>`<button data-go="${t[0]}"><span>${ic(t[1])}</span>${t[2]}</button>`).join(''));
render();
</script></body></html>
